[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routemanager-autobridge"
version = "1.0.0"
description = "Scheduling bridge that expands CRM maintenance memberships into dated route-management service orders"
readme = "README.md"
# Pinned to the deployed Zoho Catalyst stack (python_3_9 in both
# functions/*/catalyst-config.json). CI tests on 3.9 for the same reason.
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly so `ruff check` is reproducible across ruff versions,
# which have changed their implicit default set over time.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These scripts must extend sys.path before importing from src/, so their
# imports cannot sit at the top of the file.
"tests/manual/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["functions/rm_autobridge"]
# tests/manual holds hand-run scripts, some of which write to live systems.
# They are named to fall outside python_files, and excluded here as well.
norecursedirs = ["manual"]
